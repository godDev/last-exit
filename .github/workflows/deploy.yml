name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets the Pages deployment run.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` type-checks first, so a broken build never reaches the site
      - run: npm run build

      # No `enablement: true` here. The workflow's own GITHUB_TOKEN cannot create the
      # Pages site ("Resource not accessible by integration"), so turning Pages on is a
      # one-off done with a user token or from Settings -> Pages -> Source: GitHub Actions.
      # Leaving enablement on would make every run fail on repositories where it is not
      # yet enabled, instead of just the first one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
