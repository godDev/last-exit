<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LAST EXIT</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <div id="overlay">
        <div id="subtitles" class="subs"></div>
        <div id="hud" class="hud"></div>
        <div id="prompt" class="prompt hidden"></div>
        <div id="journal" class="journal hidden"></div>
        <div id="choices" class="choices hidden"></div>
        <div id="ending" class="ending hidden"></div>
        <div id="debug" class="debug hidden"></div>
      </div>

      <div id="boot" class="boot">
        <div class="boot-inner">
          <h1>LAST&nbsp;EXIT</h1>
          <p class="boot-sub" data-i18n="boot.context"></p>
          <p class="boot-brief" data-i18n="boot.brief"></p>
          <p class="boot-note" data-i18n="boot.note"></p>
          <button id="boot-start" class="boot-btn" data-i18n="boot.start"></button>
          <div class="boot-lang">
            <button data-lang="en" class="lang-btn">EN</button>
            <button data-lang="ru" class="lang-btn">RU</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
